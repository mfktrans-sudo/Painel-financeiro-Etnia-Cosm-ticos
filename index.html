<style>
  :root{
    --navy-950:#05070f;
    --navy-900:#0a0f24;
    --navy-800:#0f1533;
    --navy-700:#141b3d;
    --navy-600:#1c2450;
    --lime:#d7ff3d;
    --lime-soft:#eaffa0;
    --lime-glow:rgba(215,255,61,.45);
    --coral:#ff6b81;
    --sky:#5b8cff;
    --ok:#22c55e;
    --warn:#f5a623;
    --danger:#ef4444;
    --ink-muted:#93a0c4;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:
      radial-gradient(1200px 600px at 12% -10%, #1a2456 0%, transparent 55%),
      radial-gradient(900px 500px at 110% 10%, #101a3d 0%, transparent 50%),
      linear-gradient(160deg,var(--navy-950) 0%, var(--navy-900) 45%, #0b1130 100%);
    min-height:100vh;
    color:#0f1533;
  }
  .font-display{font-family:'Space Grotesk',sans-serif;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2a3468;border-radius:8px;}

  .neon-shard{position:absolute;background:linear-gradient(135deg,var(--lime) 0%,#a6e600 100%);filter:drop-shadow(0 0 14px var(--lime-glow));}
  .brand-title{
    font-family:'Space Grotesk',sans-serif;
    letter-spacing:.02em;
    color:#fff;
    text-shadow:0 0 1px rgba(255,255,255,.6), 0 0 22px rgba(160,190,255,.35);
  }
  .brand-sub{color:var(--lime);letter-spacing:.35em;font-weight:600;}

  .glass-card{
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(6px);
  }
  .kpi-card{
    background:linear-gradient(160deg,var(--navy-700) 0%, var(--navy-800) 100%);
    border:1px solid rgba(255,255,255,.07);
    position:relative;
    overflow:hidden;
  }
  .kpi-card::after{
    content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;
    background:radial-gradient(circle, var(--lime-glow), transparent 70%);
    opacity:.5;
  }
  .kpi-value{font-family:'Space Grotesk',sans-serif;color:#fff;}
  .kpi-label{color:var(--ink-muted);}

  .tab-pill{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;font-size:13.5px;
    padding:10px 16px;border-radius:999px;
    transition:all .18s ease;
    white-space:nowrap;
    border:1px solid transparent;
  }
  .tab-pill.active{
    background:var(--lime);color:#0b1130;
    box-shadow:0 0 22px var(--lime-glow);
  }
  .tab-pill.inactive{
    background:rgba(255,255,255,.05);color:#c7d0ee;
    border-color:rgba(255,255,255,.08);
  }
  .tab-pill.inactive:hover{background:rgba(255,255,255,.11);}

  .panel{
    background:#ffffff;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(3,6,20,.45);
  }
  .badge{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:11px;padding:4px 10px;border-radius:999px;letter-spacing:.02em;}
  .badge-pago{background:#dcfce7;color:#15803d;}
  .badge-vencido{background:#fee2e2;color:#b91c1c;}
  .badge-prazo{background:#fef3c7;color:#a15c00;}

  table.data-table{border-collapse:separate;border-spacing:0;width:100%;}
  table.data-table thead th{
    position:sticky;top:0;background:#0f1533;color:#dfe6ff;
    font-family:'Space Grotesk',sans-serif;font-size:11.5px;letter-spacing:.04em;
    text-transform:uppercase;padding:10px 12px;text-align:left;z-index:1;
  }
  table.data-table tbody td{padding:9px 12px;font-size:13px;color:#1c2440;border-bottom:1px solid #eef0f8;}
  table.data-table tbody tr:hover{background:#f7f8ff;}
  table.data-table tbody tr:nth-child(even){background:#fbfbff;}
  table.data-table tbody tr:nth-child(even):hover{background:#f2f3ff;}

  .input-field{
    border:1.5px solid #e2e5f3;border-radius:10px;padding:9px 12px;font-size:13.5px;
    background:#fff;color:#141b3d;transition:.15s;
  }
  .input-field:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(91,140,255,.15);}

  .chip-btn{
    font-size:12px;font-weight:700;padding:6px 12px;border-radius:9px;
    background:#eef0fb;color:#334;border:1px solid #e2e5f6;cursor:pointer;transition:.15s;
  }
  .chip-btn:hover{background:#e2e6fb;}
  .chip-btn.on{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}

  .scrollbox{max-height:560px;overflow:auto;border-radius:12px;}

  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .floaty{animation:floaty 4s ease-in-out infinite;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .fadein{animation:fadein .35s ease both;}

  .kpi-card.clickable{cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
  .kpi-card.clickable:hover{transform:translateY(-2px);}
  .kpi-card.kpi-active{border-color:var(--lime);box-shadow:0 0 0 2px rgba(215,255,61,.35), 0 8px 24px rgba(0,0,0,.35);}
  .kpi-hint{position:absolute;bottom:8px;right:12px;font-size:10px;color:var(--ink-muted);opacity:.7;}

  .tool-btn{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;
    padding:10px 18px;border-radius:999px;background:var(--lime);color:#0b1130;
    border:none;cursor:pointer;box-shadow:0 0 18px var(--lime-glow);transition:.15s;
  }
  .tool-btn:hover{filter:brightness(1.06);transform:translateY(-1px);}

  .modal-overlay{position:fixed;inset:0;background:rgba(5,7,15,.72);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-box{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.5);}
  .modal-head{position:sticky;top:0;background:var(--navy-900);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;z-index:2;}
  .modal-tab{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:10px 10px 0 0;cursor:pointer;color:#8891b8;background:transparent;border:none;}
  .modal-tab.active{background:#fff;color:var(--navy-900);}
  .form-label{font-size:12px;font-weight:700;color:#334;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
  .form-row{margin-bottom:14px;}
  .btn-primary{background:var(--navy-800);color:#fff;font-weight:700;padding:10px 20px;border-radius:10px;border:none;cursor:pointer;font-size:13.5px;}
  .btn-primary:hover{background:var(--navy-700);}
  .btn-secondary{background:#eef0fb;color:#334;font-weight:700;padding:10px 20px;border-radius:10px;border:none;cursor:pointer;font-size:13.5px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:200;}
  .comm-input{width:70px;border:1px solid #e2e5f3;border-radius:8px;padding:4px 6px;font-size:12.5px;text-align:right;}
</style>

<script type="text/babel">
const {useState,useEffect,useMemo,useRef,useCallback} = React;

/* ================= HELPERS ================= */
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmtMoney = (v) => BRL.format(v||0);
const fmtCompact = (v) => {
  const n = v||0;
  if(Math.abs(n) >= 1000000) return 'R$ ' + (n/1000000).toFixed(2).replace('.',',') + 'M';
  if(Math.abs(n) >= 1000) return 'R$ ' + (n/1000).toFixed(1).replace('.',',') + 'k';
  return fmtMoney(n);
};
const fmtDate = (iso) => {
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return d+'/'+m+'/'+y;
};
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const monthKey = (iso) => iso ? iso.slice(0,7) : null;
const monthLabel = (key) => { if(!key) return ''; const [y,m] = key.split('-'); return MESES[parseInt(m,10)-1] + '/' + y.slice(2); };

function statusBadge(status){
  if(status === 'PAGO') return <span className="badge badge-pago">● Pago</span>;
  if(status === 'VENCIDO') return <span className="badge badge-vencido">● Vencido</span>;
  return <span className="badge badge-prazo">● Em prazo</span>;
}

function uniqSorted(arr, key){
  const s = new Set();
  arr.forEach(r => { if(r[key]) s.add(r[key]); });
  return Array.from(s).sort();
}

function downloadWorkbook(sheets, filename){
  const wb = XLSX.utils.book_new();
  sheets.forEach(({name, rows}) => {
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name.substring(0,31));
  });
  XLSX.writeFile(wb, filename);
}

/* ================= REUSABLE UI ================= */

function ChartCanvas({type, data, options, height}){
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if(!canvasRef.current) return;
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext('2d'), {type, data, options});
    return () => { if(chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data), JSON.stringify(options), type]);
  return <div style={{height: height || 280, position:'relative'}}><canvas ref={canvasRef}></canvas></div>;
}

/* ================= AGGREGATIONS ================= */

function useAggregates(receber, pagar){
  return useMemo(() => {
    const totReceberTit = receber.reduce((s,r)=>s+r.valor,0);
    const totReceberPago = receber.filter(r=>r.status==='PAGO').reduce((s,r)=>s+r.pago,0);
    const totReceberVencido = receber.filter(r=>r.status==='VENCIDO').reduce((s,r)=>s+r.valor,0);
    const totReceberPrazo = receber.filter(r=>r.status==='EM PRAZO').reduce((s,r)=>s+r.valor,0);

    const totPagarTit = pagar.reduce((s,r)=>s+r.valor,0);
    const totPagarPago = pagar.filter(r=>r.status==='PAGO').reduce((s,r)=>s+r.pago,0);
    const totPagarVencido = pagar.filter(r=>r.status==='VENCIDO').reduce((s,r)=>s+r.valor,0);
    const totPagarPrazo = pagar.filter(r=>r.status==='EM PRAZO').reduce((s,r)=>s+r.valor,0);

    const inadReceber = totReceberTit ? (totReceberVencido/totReceberTit*100) : 0;
    const inadPagar = totPagarTit ? (totPagarVencido/totPagarTit*100) : 0;

    // monthly aggregation by vencimento
    const monthsSet = new Set();
    receber.forEach(r=>{ if(r.venc) monthsSet.add(monthKey(r.venc)); });
    pagar.forEach(r=>{ if(r.venc) monthsSet.add(monthKey(r.venc)); });
    const months = Array.from(monthsSet).sort();

    const monthly = months.map(mk => {
      const rIn = receber.filter(r=>monthKey(r.venc)===mk);
      const pIn = pagar.filter(r=>monthKey(r.venc)===mk);
      return {
        month: mk,
        label: monthLabel(mk),
        receberTit: rIn.reduce((s,r)=>s+r.valor,0),
        receberPago: rIn.filter(r=>r.status==='PAGO').reduce((s,r)=>s+r.pago,0),
        pagarTit: pIn.reduce((s,r)=>s+r.valor,0),
        pagarPago: pIn.filter(r=>r.status==='PAGO').reduce((s,r)=>s+r.pago,0),
      };
    });

    let acc = 0;
    monthly.forEach(m => { acc += (m.receberPago - m.pagarPago); m.saldoAcumulado = acc; });

    return {
      totReceberTit, totReceberPago, totReceberVencido, totReceberPrazo,
      totPagarTit, totPagarPago, totPagarVencido, totPagarPrazo,
      inadReceber, inadPagar, monthly,
      saldoLiquido: totReceberPago - totPagarPago,
    };
  }, [receber, pagar]);
}

function agingBuckets(rows){
  const buckets = {'0-30':0, '31-60':0, '61-90':0, '90+':0};
  rows.filter(r=>r.status==='VENCIDO').forEach(r=>{
    const d = r.diasVenc||0;
    if(d<=30) buckets['0-30'] += r.valor;
    else if(d<=60) buckets['31-60'] += r.valor;
    else if(d<=90) buckets['61-90'] += r.valor;
    else buckets['90+'] += r.valor;
  });
  return buckets;
}

function topByPessoa(rows, statusFilter, n){
  const map = {};
  rows.forEach(r=>{
    if(statusFilter && r.status!==statusFilter) return;
    if(!r.pessoa) return;
    map[r.pessoa] = (map[r.pessoa]||0) + r.valor;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

function topByTipo(rows, tipoKey, n){
  const map = {};
  rows.forEach(r=>{
    const t = r[tipoKey] || 'Não informado';
    map[t] = (map[t]||0) + r.valor;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

function monthlyByRows(rows){
  const map = {};
  rows.forEach(r=>{
    const mk = monthKey(r.venc);
    if(!mk) return;
    map[mk] = (map[mk]||0) + r.valor;
  });
  return Object.keys(map).sort().map(mk=>({label:monthLabel(mk), valor:map[mk]}));
}

/* ================= TAB: CONTAS (RECEBER / PAGAR genérico) ================= */

function ContasTab({rows, kind}){
  const isReceber = kind === 'receber';
  const tipoField = isReceber ? 'tipo' : 'tipo';
  const tipoLabel = isReceber ? 'Tipo de Receita' : 'Tipo de Gasto';
  const pessoaLabel = isReceber ? 'Cliente / Pagador' : 'Fornecedor / Favorecido';
  const extraLabel = isReceber ? 'Vendedor' : 'Portador da Baixa';
  const extraField = isReceber ? 'vendedor' : 'portador';

  const [busca, setBusca] = useState('');
  const [status, setStatus] = useState('TODOS');
  const [tipo, setTipo] = useState('TODOS');
  const [extra, setExtra] = useState('TODOS');
  const [vencIni, setVencIni] = useState('');
  const [vencFim, setVencFim] = useState('');
  const [pagIni, setPagIni] = useState('');
  const [pagFim, setPagFim] = useState('');
  const [page, setPage] = useState(0);
  const perPage = 25;

  const tipos = useMemo(()=>uniqSorted(rows, tipoField), [rows]);
  const extras = useMemo(()=>uniqSorted(rows, extraField), [rows]);

  const filtered = useMemo(() => {
    const b = busca.trim().toLowerCase();
    return rows.filter(r => {
      if(b){
        const alvo = [r.pessoa, r.desc, r.cod, r.nf].filter(Boolean).join(' | ').toLowerCase();
        if(!alvo.includes(b)) return false;
      }
      if(status!=='TODOS' && r.status!==status) return false;
      if(tipo!=='TODOS' && r[tipoField]!==tipo) return false;
      if(extra!=='TODOS' && r[extraField]!==extra) return false;
      if(vencIni && (!r.venc || r.venc < vencIni)) return false;
      if(vencFim && (!r.venc || r.venc > vencFim)) return false;
      if(pagIni && (!r.pgto || r.pgto < pagIni)) return false;
      if(pagFim && (!r.pgto || r.pgto > pagFim)) return false;
      return true;
    });
  }, [rows, busca, status, tipo, extra, vencIni, vencFim, pagIni, pagFim]);

  useEffect(()=>{ setPage(0); }, [busca, status, tipo, extra, vencIni, vencFim, pagIni, pagFim]);

  const limparFiltros = () => {
    setBusca(''); setStatus('TODOS'); setTipo('TODOS'); setExtra('TODOS');
    setVencIni(''); setVencFim(''); setPagIni(''); setPagFim('');
  };

  const filtrosAtivos = busca || status!=='TODOS' || tipo!=='TODOS' || extra!=='TODOS' || vencIni || vencFim || pagIni || pagFim;

  const totals = useMemo(() => {
    const totVal = filtered.reduce((s,r)=>s+r.valor,0);
    const totPago = filtered.filter(r=>r.status==='PAGO').reduce((s,r)=>s+r.pago,0);
    const totVenc = filtered.filter(r=>r.status==='VENCIDO').reduce((s,r)=>s+r.valor,0);
    return {totVal, totPago, totVenc};
  }, [filtered]);

  // gráficos reagem ao filtro aplicado
  const statusChartData = useMemo(() => {
    const pago = filtered.filter(r=>r.status==='PAGO').reduce((s,r)=>s+r.valor,0);
    const venc = filtered.filter(r=>r.status==='VENCIDO').reduce((s,r)=>s+r.valor,0);
    const prazo = filtered.filter(r=>r.status==='EM PRAZO').reduce((s,r)=>s+r.valor,0);
    return {labels:['Pago','Vencido','Em prazo'], datasets:[{data:[pago,venc,prazo], backgroundColor:['#22c55e','#ef4444','#f5a623'], borderWidth:0}]};
  }, [filtered]);

  const evolChartData = useMemo(() => {
    const map = {};
    filtered.forEach(r => {
      const mk = monthKey(r.venc);
      if(!mk) return;
      if(!map[mk]) map[mk] = {valor:0, pago:0};
      map[mk].valor += r.valor;
      if(r.status==='PAGO') map[mk].pago += r.pago;
    });
    const keys = Object.keys(map).sort();
    return {
      labels: keys.map(monthLabel),
      datasets: [
        {label:'Valor em título', data: keys.map(k=>map[k].valor), backgroundColor:'#5b8cff', borderRadius:6},
        {label:'Valor recebido', data: keys.map(k=>map[k].pago), backgroundColor:'#22c55e', borderRadius:6},
      ]
    };
  }, [filtered]);

  const pageRows = filtered.slice(page*perPage, page*perPage+perPage);

  const exportar = () => {
    const data = filtered.map(r => isReceber ? ({
      'Código': r.cod, 'NF-e': r.nf, 'Pessoa': r.pessoa, 'Portador': r.portador, 'Valor': r.valor,
      'Vencimento': r.venc, 'Status': r.status, 'Tipo de Receita': r.tipo, 'Pagamento': r.pgto,
      'Descrição': r.desc, 'Vendedor': r.vendedor, 'Dias Vencido': r.diasVenc, 'Valor Pago': r.pago
    }) : ({
      'Código': r.cod, 'Vencimento': r.venc, 'Pessoa': r.pessoa, 'Tipo Doc': r.doc, 'Descrição': r.desc,
      'Valor': r.valor, 'Tipo de Gasto': r.tipo, 'Status': r.status, 'Valor Pago': r.pago,
      'Pagamento': r.pgto, 'Portador': r.portador, 'Dias Vencido': r.diasVenc
    }));
    downloadWorkbook([{name: isReceber?'Contas a Receber':'Contas a Pagar', rows: data}], (isReceber?'contas_a_receber':'contas_a_pagar')+'_filtrado.xlsx');
  };

  return (
    <div className="fadein">
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-5">
        <KpiCard label={isReceber?'Total filtrado a receber':'Total filtrado a pagar'} value={fmtCompact(totals.totVal)} sub={filtered.length+' registros'} icon={isReceber?'💰':'💳'}/>
        <KpiCard label="Já baixado" value={fmtCompact(totals.totPago)} accent="var(--lime)" icon="✅"/>
        <KpiCard label="Vencido" value={fmtCompact(totals.totVenc)} accent="#f87171" icon="⚠️"/>
      </div>

      <div className="panel p-5 mb-5">
        <SectionHeader
          title={isReceber ? 'Contas a Receber' : 'Contas a Pagar'}
          subtitle="Filtre por título, pessoa, status, tipo, vencimento ou pagamento — tabela e gráficos abaixo acompanham o filtro"

/* ================= TAB: FLUXO DE CAIXA ================= */

function FluxoCaixa({receber, pagar}){
  const agg = useAggregates(receber, pagar);

  const barData = {
    labels: agg.monthly.map(m=>m.label),
    datasets: [
      {label:'Entradas (recebido)', data: agg.monthly.map(m=>m.receberPago), backgroundColor:'#22c55e', borderRadius:6},
      {label:'Saídas (pago)', data: agg.monthly.map(m=>-m.pagarPago), backgroundColor:'#ff6b81', borderRadius:6},
    ]
  };
  const netData = {
    labels: agg.monthly.map(m=>m.label),
    datasets: [{label:'Resultado do mês', data: agg.monthly.map(m=>m.receberPago-m.pagarPago), backgroundColor: agg.monthly.map(m=> (m.receberPago-m.pagarPago)>=0 ? '#d7ff3d' : '#ff6b81'), borderRadius:6}]
  };

  return (
    <div className="fadein">
      <div className="grid grid-cols-1 md:grid-cols-4 gap-3 mb-5">
        <KpiCard label="Total Recebido" value={fmtCompact(agg.totReceberPago)} accent="var(--lime)" icon="⬆️"/>
        <KpiCard label="Total Pago" value={fmtCompact(agg.totPagarPago)} accent="#ff6b81" icon="⬇️"/>
        <KpiCard label="Resultado do Período" value={fmtCompact(agg.saldoLiquido)} accent={agg.saldoLiquido>=0?'var(--lime)':'#ff6b81'} icon="📈"/>
        <KpiCard label="Meses no período" value={agg.monthly.length} icon="🗓️"/>
      </div>

      <div className="panel p-5 mb-5">
        <SectionHeader title="Entradas × Saídas (barras espelhadas)" subtitle="Comparativo mensal do que efetivamente entrou e saiu do caixa"/>
        <ChartCanvas type="bar" data={barData} options={{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:v=>fmtCompact(Math.abs(v))}}}}} height={300}/>
      </div>

      <div className="panel p-5 mb-5">
        <SectionHeader title="Resultado líquido por mês" subtitle="Recebido menos pago em cada mês"/>
        <ChartCanvas type="bar" data={netData} options={{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>fmtCompact(v)}}}}} height={260}/>
      </div>

      <div className="panel p-5">
        <SectionHeader title="Detalhamento mensal"/>
        <div className="scrollbox" style={{maxHeight:340}}>
          <table className="data-table">
            <thead><tr><th>Mês</th><th>Títulos a Receber</th><th>Recebido</th><th>Títulos a Pagar</th><th>Pago</th><th>Resultado</th><th>Saldo Acumulado</th></tr></thead>
            <tbody>
              {agg.monthly.map((m,i)=>(
                <tr key={i}>
                  <td className="font-semibold">{m.label}</td>
                  <td>{fmtMoney(m.receberTit)}</td>
                  <td className="text-green-700 font-semibold">{fmtMoney(m.receberPago)}</td>
                  <td>{fmtMoney(m.pagarTit)}</td>
                  <td className="text-red-600 font-semibold">{fmtMoney(m.pagarPago)}</td>
                  <td className={(m.receberPago-m.pagarPago)>=0?'text-green-700 font-bold':'text-red-600 font-bold'}>{fmtMoney(m.receberPago-m.pagarPago)}</td>
                  <td className="font-semibold">{fmtMoney(m.saldoAcumulado)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

  );

/* ================= TAB: VENDEDORES ================= */

function Vendedores({receber, comissoes}){
  const [apenasVendas, setApenasVendas] = useState(true);
  const [ocultarSemVendedor, setOcultarSemVendedor] = useState(false);
  const [busca, setBusca] = useState('');
  const [ordem, setOrdem] = useState('valor');

  const base = useMemo(() => {
    return receber.filter(r => apenasVendas ? r.tipo==='VENDA DE MERCADORIAS' : true);
  }, [receber, apenasVendas]);

  const porVendedor = useMemo(() => {
    const map = {};
    base.forEach(r => {
      const v = r.vendedor || 'Não Indicado';
      if(!map[v]) map[v] = {vendedor:v, qtd:0, valor:0, pago:0, vencido:0};
      map[v].qtd += 1;
      map[v].valor += r.valor;
      if(r.status==='PAGO') map[v].pago += r.pago;
      if(r.status==='VENCIDO') map[v].vencido += r.valor;
    });
    let arr = Object.values(map);
    if(ocultarSemVendedor) arr = arr.filter(v => v.vendedor!=='SEM VENDEDOR' && v.vendedor!=='Não Indicado');
    if(busca) arr = arr.filter(v => v.vendedor.toLowerCase().includes(busca.toLowerCase()));
    arr.sort((a,b) => b[ordem]-a[ordem]);
    return arr;
  }, [base, ocultarSemVendedor, busca, ordem]);

  const totalGeral = base.reduce((s,r)=>s+r.valor,0);
  const totalVendedores = porVendedor.length;
  const topVendedor = porVendedor[0];

  const chartArr = porVendedor.slice(0,15);
  const barData = {
    labels: chartArr.map(v=>v.vendedor),
    datasets: [{data: chartArr.map(v=>v.valor), backgroundColor:'#5b8cff', borderRadius:6}]
  };

  const exportar = () => {
    const rows = porVendedor.map(v => ({
      'Vendedor': v.vendedor, 'Qtd. Títulos': v.qtd, 'Valor Vendido': v.valor,
      'Valor Recebido': v.pago, 'Valor Vencido': v.vencido,
      '% do Total': totalGeral ? Number((v.valor/totalGeral*100).toFixed(2)) : 0
    }));
    downloadWorkbook([{name:'Vendas por Vendedor', rows}], 'Etnia_Cosmeticos_Vendas_por_Vendedor.xlsx');
  };

  return (
    <div className="fadein">
      <div className="grid grid-cols-1 md:grid-cols-4 gap-3 mb-5">
        <KpiCard label="Total Vendido" value={fmtCompact(totalGeral)} sub={base.length+' títulos'} icon="🏷️"/>
        <KpiCard label="Vendedores Ativos" value={totalVendedores} icon="🧑‍💼"/>
        <KpiCard label="Maior Vendedor" value={topVendedor ? topVendedor.vendedor : '—'} sub={topVendedor?fmtMoney(topVendedor.valor):''} icon="🏆"/>
        <KpiCard label="Ticket Médio" value={fmtCompact(base.length ? totalGeral/base.length : 0)} sub="por título" icon="📐"/>
      </div>

      <div className="panel p-5 mb-5">
        <SectionHeader title="Ranking de vendedores" subtitle="Top 15 por valor total vendido"/>
        <ChartCanvas type="bar" data={barData} options={{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{callback:v=>fmtCompact(v)}}}}} height={Math.max(260, chartArr.length*28)}/>
      </div>

      <div className="panel p-5">
        <SectionHeader
          title="Vendas por Vendedor"
          subtitle="Baseado no campo Vendedor Preferencial das contas a receber"
          right={<button onClick={exportar} className="chip-btn on">⬇ Exportar Excel</button>}
        />

        <div className="grid grid-cols-1 md:grid-cols-4 gap-2 mb-4">
          <input className="input-field md:col-span-2" placeholder="Buscar vendedor..." value={busca} onChange={e=>setBusca(e.target.value)}/>
          <label className="flex items-center gap-2 text-sm text-gray-600 px-1">
            <input type="checkbox" checked={apenasVendas} onChange={e=>setApenasVendas(e.target.checked)}/>
            Somente "Venda de Mercadorias"
          </label>
          <label className="flex items-center gap-2 text-sm text-gray-600 px-1">
            <input type="checkbox" checked={ocultarSemVendedor} onChange={e=>setOcultarSemVendedor(e.target.checked)}/>
            Ocultar "Sem Vendedor" / "Não Indicado"
          </label>
        </div>

        <div className="flex gap-2 mb-3">
          {[['valor','Valor'],['qtd','Qtd. Títulos'],['pago','Recebido'],['vencido','Vencido']].map(([k,l]) => (
            <button key={k} onClick={()=>setOrdem(k)} className={"chip-btn "+(ordem===k?'on':'')}>Ordenar por {l}</button>
          ))}
        </div>

        <div className="scrollbox">
          <table className="data-table">
            <thead>
              <tr>
                <th>Vendedor</th>
                <th>Qtd. Títulos</th>
                <th>Valor Vendido</th>
                <th>Valor Recebido</th>
                <th>Valor Vencido</th>
                <th>% do Total</th>
                <th>Comissão %</th>
                <th>Comissão Estimada</th>
              </tr>
            </thead>
            <tbody>
              {porVendedor.map((v,i) => {
                const pct = (comissoes && comissoes[v.vendedor]) || 0;
                return (
                <tr key={i}>
                  <td className="font-semibold">{v.vendedor}</td>
                  <td>{v.qtd}</td>
                  <td className="font-semibold">{fmtMoney(v.valor)}</td>
                  <td className="text-green-700">{fmtMoney(v.pago)}</td>
                  <td className={v.vencido>0?'text-red-600 font-semibold':'text-gray-400'}>{fmtMoney(v.vencido)}</td>
                  <td>{totalGeral ? (v.valor/totalGeral*100).toFixed(1) : '0.0'}%</td>
                  <td>{pct ? pct+'%' : '—'}</td>
                  <td className="font-semibold" style={{color:pct?'#15803d':'#9ca3af'}}>{pct ? fmtMoney(v.valor*pct/100) : '—'}</td>
                </tr>
                );
              })}
              {porVendedor.length===0 && (
                <tr><td colSpan="8" className="text-center text-gray-400 py-8">Nenhum vendedor encontrado para os filtros aplicados.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ================= FERRAMENTAS: NOVA VENDA / VENDEDOR / COMISSÃO ================= */

function DataManager({vendedoresAll, onAddVenda, onAddVendedor, comissoes, onSetComissao, onClose, onToast}){
  const [tab, setTab] = useState('venda');

  // --- Nova venda ---
  const [pessoa, setPessoa] = useState('');
  const [vendedorSel, setVendedorSel] = useState('');
  const [vendedorNovo, setVendedorNovo] = useState('');
  const [valor, setValor] = useState('');
  const [venc, setVenc] = useState('');
  const [status, setStatus] = useState('EM PRAZO');
  const [desc, setDesc] = useState('');

  const submitVenda = (e) => {
    e.preventDefault();
    const vendedorFinal = (vendedorSel === '__novo__' ? vendedorNovo.trim() : vendedorSel) || 'SEM VENDEDOR';
    const valorNum = parseFloat(String(valor).replace(',', '.'));
    if(!pessoa.trim() || !valorNum || !venc){
      onToast('Preencha cliente, valor e vencimento.');
      return;
    }
    const today = new Date().toISOString().slice(0,10);
    let diasVenc = 0;
    if(status === 'VENCIDO'){
      const d1 = new Date(venc), d2 = new Date(today);
      diasVenc = Math.max(0, Math.round((d2-d1)/86400000));
    }
    const novaVenda = {
      cod: 'MANUAL-'+Date.now(),
      nf: null,
      pessoa: pessoa.trim(),
      portador: 'MANUAL',
      valor: valorNum,
      venc,
      status,
      tipo: 'VENDA DE MERCADORIAS',
      pgto: status==='PAGO' ? today : null,
      desc: desc.trim() || 'LANÇAMENTO MANUAL',
      cad: today,
      doc: 'MANUAL',
      multa: 0, juros: 0,
      pago: status==='PAGO' ? valorNum : 0,
      diasVenc,
      vendedor: vendedorFinal,
    };
    onAddVenda(novaVenda);
    if(vendedorSel==='__novo__' && vendedorNovo.trim()) onAddVendedor(vendedorNovo.trim());
    onToast('Venda adicionada com sucesso!');
    setPessoa(''); setValor(''); setVenc(''); setDesc(''); setVendedorSel(''); setVendedorNovo('');
  };

  // --- Novo vendedor ---
  const [novoVendedorNome, setNovoVendedorNome] = useState('');
  const submitVendedor = (e) => {
    e.preventDefault();
    if(!novoVendedorNome.trim()){ onToast('Digite o nome do vendedor.'); return; }
    onAddVendedor(novoVendedorNome.trim());
    onToast('Vendedor cadastrado!');
    setNovoVendedorNome('');
  };

  return (
    <div className="modal-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-box">
        <div className="modal-head">
          <div className="font-display font-bold text-base">🛠️ Ferramentas de Gestão</div>
          <button onClick={onClose} className="text-white text-xl leading-none px-2" style={{background:'transparent',border:'none',cursor:'pointer'}}>×</button>
        </div>
        <div className="flex gap-1 px-5 pt-4" style={{borderBottom:'1px solid #eef0f8'}}>
          <button className={"modal-tab"+(tab==='venda'?' active':'')} onClick={()=>setTab('venda')}>➕ Nova Venda</button>
          <button className={"modal-tab"+(tab==='vendedor'?' active':'')} onClick={()=>setTab('vendedor')}>🧑‍💼 Novo Vendedor</button>
          <button className={"modal-tab"+(tab==='comissao'?' active':'')} onClick={()=>setTab('comissao')}>% Comissões</button>
        </div>

        <div className="p-6">
          {tab==='venda' && (
            <form onSubmit={submitVenda}>
              <div className="form-row">
                <label className="form-label">Cliente / Pessoa</label>
                <input className="input-field w-full" value={pessoa} onChange={e=>setPessoa(e.target.value)} placeholder="Nome do cliente"/>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div className="form-row">
                  <label className="form-label">Vendedor</label>
                  <select className="input-field w-full" value={vendedorSel} onChange={e=>setVendedorSel(e.target.value)}>
                    <option value="">Selecione...</option>
                    {vendedoresAll.map(v => <option key={v} value={v}>{v}</option>)}
                    <option value="__novo__">+ Cadastrar novo vendedor</option>
                  </select>
                </div>
                {vendedorSel==='__novo__' && (
                  <div className="form-row">
                    <label className="form-label">Nome do novo vendedor</label>
                    <input className="input-field w-full" value={vendedorNovo} onChange={e=>setVendedorNovo(e.target.value)} placeholder="Nome completo"/>
                  </div>
                )}
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div className="form-row">
                  <label className="form-label">Valor (R$)</label>
                  <input className="input-field w-full" value={valor} onChange={e=>setValor(e.target.value)} placeholder="Ex: 1500.00" inputMode="decimal"/>
                </div>
                <div className="form-row">
                  <label className="form-label">Vencimento</label>
                  <input type="date" className="input-field w-full" value={venc} onChange={e=>setVenc(e.target.value)}/>
                </div>
              </div>
              <div className="form-row">
                <label className="form-label">Status</label>
                <div className="flex gap-2">
                  {[['EM PRAZO','Em prazo'],['PAGO','Pago'],['VENCIDO','Vencido']].map(([k,l])=>(
                    <button type="button" key={k} onClick={()=>setStatus(k)} className={"chip-btn "+(status===k?'on':'')}>{l}</button>
                  ))}
                </div>
              </div>
              <div className="form-row">
                <label className="form-label">Descrição (opcional)</label>
                <input className="input-field w-full" value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Ex: Ref. pedido 1234"/>
              </div>
              <div className="flex justify-end gap-2 mt-2">
                <button type="button" className="btn-secondary" onClick={onClose}>Cancelar</button>
                <button type="submit" className="btn-primary">Adicionar venda</button>
              </div>
            </form>
          )}

          {tab==='vendedor' && (
            <div>
              <form onSubmit={submitVendedor} className="mb-5">
                <div className="form-row">
                  <label className="form-label">Nome do novo vendedor</label>
                  <div className="flex gap-2">
                    <input className="input-field w-full" value={novoVendedorNome} onChange={e=>setNovoVendedorNome(e.target.value)} placeholder="Ex: João da Silva"/>
                    <button type="submit" className="btn-primary" style={{whiteSpace:'nowrap'}}>Cadastrar</button>
                  </div>
                </div>
              </form>
              <div className="text-xs font-semibold text-gray-500 uppercase mb-2">Vendedores cadastrados ({vendedoresAll.length})</div>
              <div className="scrollbox" style={{maxHeight:220}}>
                <table className="data-table">
                  <thead><tr><th>Vendedor</th></tr></thead>
                  <tbody>
                    {vendedoresAll.map((v,i)=>(<tr key={i}><td>{v}</td></tr>))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {tab==='comissao' && (
            <div>
              <p className="text-sm text-gray-500 mb-4">Defina o percentual de comissão de cada vendedor. Isso é usado para calcular a comissão estimada na aba Vendedores.</p>
              <div className="scrollbox" style={{maxHeight:380}}>
                <table className="data-table">
                  <thead><tr><th>Vendedor</th><th style={{width:120}}>Comissão %</th></tr></thead>
                  <tbody>
                    {vendedoresAll.map((v,i)=>(
                      <tr key={i}>
                        <td>{v}</td>
                        <td>
                          <input
                            type="number" min="0" max="100" step="0.5"
                            className="comm-input"
                            value={comissoes[v] ?? ''}
                            onChange={e=>onSetComissao(v, e.target.value===''?0:parseFloat(e.target.value))}
                            placeholder="0"
                          /> %
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="flex justify-end mt-4">
                <button className="btn-primary" onClick={onClose}>Concluir</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ================= APP SHELL ================= */

const TABS = [
  {id:'geral', label:'Painel Geral', icon:'🏠'},
  {id:'receber', label:'Contas a Receber', icon:'💰'},
  {id:'pagar', label:'Contas a Pagar', icon:'💳'},
  {id:'vendedores', label:'Vendedores', icon:'🧑‍💼'},
  {id:'fluxo', label:'Fluxo de Caixa', icon:'📊'},
  {id:'vencidos', label:'Vencidos', icon:'⚠️'},
  {id:'categorias', label:'Categorias', icon:'📈'},
  {id:'relatorios', label:'Relatórios', icon:'📑'},
];

function Header(){
  return (
    <header className="relative rounded-3xl p-6 md:p-8 mb-6 overflow-hidden" style={{background:'linear-gradient(135deg, #0c1130 0%, #141b3d 55%, #0a0f24 100%)', border:'1px solid rgba(255,255,255,.08)'}}>
      <div className="neon-shard floaty" style={{width:120,height:14,right:-20,top:-10,transform:'rotate(35deg)'}}></div>
      <div className="neon-shard floaty" style={{width:70,height:12,left:-18,bottom:-8,transform:'rotate(35deg)',animationDelay:'1s'}}></div>
      <div className="flex items-center gap-5 flex-wrap justify-between relative z-10">
        <div className="flex items-center gap-4">
          <img src={"data:image/webp;base64,"+window.__LOGO_B64__} alt="Etnia Cosméticos" className="rounded-2xl" style={{width:64,height:64,objectFit:'cover',boxShadow:'0 0 24px rgba(215,255,61,.25)'}}/>
          <div>
            <div className="brand-title text-2xl md:text-3xl font-bold leading-tight">Etnia Cosméticos</div>
            <div className="brand-sub text-[10px] md:text-xs mt-1">PAINEL FINANCEIRO</div>
          </div>
        </div>
        <div className="text-right">
          <div className="text-xs" style={{color:'var(--ink-muted)'}}>Contas a Pagar &amp; Receber · 2026</div>
          <div className="text-white text-sm font-semibold mt-1">Gestão de Contas — Visão Consolidada</div>
        </div>
      </div>
    </header>
  );
}

const DATA_DOC = db.collection('etnia_painel').doc('dados');

function LoginScreen(){
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [erro, setErro] = useState('');
  const [carregando, setCarregando] = useState(false);

  const entrar = async (e) => {
    e.preventDefault();
    setErro('');
    setCarregando(true);
    try {
      await auth.signInWithEmailAndPassword(email, senha);
    } catch(err){
      if(err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found'){
        setErro('E-mail ou senha inválidos.');
      } else {
        setErro('Erro ao entrar: ' + err.message);
      }
    }
    setCarregando(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <form onSubmit={entrar} className="panel p-8 w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="brand-title text-2xl font-bold" style={{color:'#0f1533'}}>Etnia Cosméticos</div>
          <div className="text-xs mt-1 font-semibold" style={{color:'var(--sky)', letterSpacing:'.3em'}}>PAINEL FINANCEIRO</div>
        </div>
        <div className="form-row">
          <label className="form-label">E-mail</label>
          <input type="email" required className="input-field w-full" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seuemail@exemplo.com"/>
        </div>
        <div className="form-row">
          <label className="form-label">Senha</label>
          <input type="password" required className="input-field w-full" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="••••••••"/>
        </div>
        {erro && <div className="text-sm mb-4" style={{color:'var(--danger)'}}>{erro}</div>}
        <button type="submit" disabled={carregando} className="btn-primary w-full">{carregando ? 'Entrando...' : 'Entrar'}</button>
      </form>
    </div>
  );
}

function App({ user }){
  const [tab, setTab] = useState('geral');
  const [vendasExtra, setVendasExtra] = useState([]);
  const [vendedoresExtra, setVendedoresExtra] = useState([]);
  const [comissoes, setComissoes] = useState({});
  const [showTools, setShowTools] = useState(false);
  const [toast, setToast] = useState('');
  const [loaded, setLoaded] = useState(false);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(()=>setToast(''), 2800);
  };

  // Carrega dados persistidos do Firestore
  useEffect(() => {
    (async () => {
      try {
        const snap = await DATA_DOC.get();
        if(snap.exists){
          const d = snap.data();
          if(d.vendasExtra) setVendasExtra(d.vendasExtra);
          if(d.vendedoresExtra) setVendedoresExtra(d.vendedoresExtra);
          if(d.comissoes) setComissoes(d.comissoes);
        }
      } catch(e){ console.error('Erro ao carregar dados do Firestore', e); }
      setLoaded(true);
    })();
  }, []);

  // Persiste alterações no Firestore (documento compartilhado entre usuários logados)
  useEffect(() => { if(loaded){ DATA_DOC.set({ vendasExtra }, { merge: true }).catch(e=>console.error(e)); } }, [vendasExtra, loaded]);
  useEffect(() => { if(loaded){ DATA_DOC.set({ vendedoresExtra }, { merge: true }).catch(e=>console.error(e)); } }, [vendedoresExtra, loaded]);
  useEffect(() => { if(loaded){ DATA_DOC.set({ comissoes }, { merge: true }).catch(e=>console.error(e)); } }, [comissoes, loaded]);

  const receber = useMemo(() => [...window.__RECEBER__, ...vendasExtra], [vendasExtra]);
  const pagar = window.__PAGAR__;

  const vendedoresAll = useMemo(() => {
    const s = new Set(uniqSorted(receber, 'vendedor'));
    vendedoresExtra.forEach(v => s.add(v));
    return Array.from(s).sort();
  }, [receber, vendedoresExtra]);

  const addVenda = (novaVenda) => setVendasExtra(prev => [...prev, novaVenda]);
  const addVendedor = (nome) => setVendedoresExtra(prev => prev.includes(nome) ? prev : [...prev, nome]);
  const setComissao = (vendedor, pct) => setComissoes(prev => ({...prev, [vendedor]: pct}));

  return (
    <div className="max-w-[1400px] mx-auto px-4 md:px-6 py-6">
      <Header/>

      <nav className="flex gap-2 mb-6 flex-wrap items-center justify-between">
        <div className="flex gap-2 flex-wrap">
          {TABS.map(t => (
            <button key={t.id} onClick={()=>setTab(t.id)} className={"tab-pill "+(tab===t.id?'active':'inactive')}>
              <span className="mr-1">{t.icon}</span>{t.label}
            </button>
          ))}
        </div>
        <div className="flex items-center gap-2">
          <button className="tool-btn" onClick={()=>setShowTools(true)}>🛠️ Ferramentas</button>
          <button
            onClick={()=>auth.signOut()}
            className="chip-btn"
            style={{background:'rgba(255,255,255,.08)', color:'#fff', border:'1px solid rgba(255,255,255,.15)'}}
            title={user && user.email}
          >
            Sair {user && user.email ? `(${user.email})` : ''}
          </button>
        </div>
      </nav>

      {tab==='geral' && <PainelGeral receber={receber} pagar={pagar}/>}
      {tab==='receber' && <ContasTab rows={receber} kind="receber"/>}
      {tab==='pagar' && <ContasTab rows={pagar} kind="pagar"/>}
      {tab==='vendedores' && <Vendedores receber={receber} comissoes={comissoes}/>}
      {tab==='fluxo' && <FluxoCaixa receber={receber} pagar={pagar}/>}
      {tab==='vencidos' && <Vencidos receber={receber} pagar={pagar}/>}
      {tab==='categorias' && <Categorias receber={receber} pagar={pagar}/>}
      {tab==='relatorios' && <Relatorios receber={receber} pagar={pagar}/>}

      {showTools && (
        <DataManager
          vendedoresAll={vendedoresAll}
          onAddVenda={addVenda}
          onAddVendedor={addVendedor}
          comissoes={comissoes}
          onSetComissao={setComissao}
          onClose={()=>setShowTools(false)}
          onToast={showToast}
        />
      )}
      {toast && <div className="toast">{toast}</div>}

      <footer className="text-center text-xs py-6" style={{color:'var(--ink-muted)'}}>
        Etnia Cosméticos — Painel Financeiro · dados de {receber.length} contas a receber e {pagar.length} contas a pagar
        {vendasExtra.length>0 && <> · {vendasExtra.length} lançamento(s) manual(is)</>}
      </footer>
      <div className="text-center text-[11px] pb-4" style={{color:'var(--ink-muted)', opacity:0.55}}>
        Criado e desenvolvido por Rafael Mariano
      </div>
    </div>
  );
}

function AuthGate(){
  const [user, setUser] = useState(undefined); // undefined = carregando, null = deslogado

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => setUser(u));
    return unsub;
  }, []);

  if(user === undefined){
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-white">Carregando...</div>
      </div>
    );
  }

  if(user === null){
    return <LoginScreen/>;
  }

  return <App user={user}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate/>);
</script>
</body>
</html>
